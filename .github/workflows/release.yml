name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; action revision of 2026-03-27 (adds 1.94.1)
        with:
          toolchain: stable

      - name: Build optimized binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p release-artifacts
          cp target/release/nq release-artifacts/nq
          sha256sum release-artifacts/nq > release-artifacts/nq.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-artifacts/nq
            release-artifacts/nq.sha256
