name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature_args: ["", "--features unrolled"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: |
          echo "::notice title=rustc::$(rustc --version) | $(cargo clippy --version)"
          cargo clippy --all-targets ${{ matrix.feature_args }} --message-format=json -- -D warnings > clippy.json || true
          python3 - <<'PY'
          import json
          n = 0
          for line in open("clippy.json"):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-message":
                  continue
              msg = m["message"]
              if msg["level"] not in ("error", "warning"):
                  continue
              sp = next((x for x in msg["spans"] if x["is_primary"]), None)
              loc = f"file={sp['file_name']},line={sp['line_start']}," if sp else ""
              code = (msg.get("code") or {}).get("code", "")
              text = (code + " " + msg["message"]).replace("\n", " ")
              print(f"::error {loc}title=clippy::{text}")
              n += 1
              if n >= 9:
                  break
          PY
          cargo clippy --all-targets ${{ matrix.feature_args }} -- -D warnings

      - name: Build release
        run: cargo build --release ${{ matrix.feature_args }}

      - name: Test
        run: cargo test ${{ matrix.feature_args }}

      - name: Smoke deterministic benchmark sweep
        run: bash scripts/smoke_bench_sweep.sh
