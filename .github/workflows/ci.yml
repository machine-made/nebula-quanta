name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature_args: ["", "--features unrolled"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; action revision of 2026-03-27 (adds 1.94.1)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets ${{ matrix.feature_args }} -- -D warnings

      - name: Build release
        run: cargo build --release ${{ matrix.feature_args }}

      - name: Test
        run: cargo test ${{ matrix.feature_args }}

      - name: Smoke deterministic benchmark sweep
        run: bash scripts/smoke_bench_sweep.sh
