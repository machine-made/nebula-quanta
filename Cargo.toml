[package]
name = "nebula-quanta"
version = "1.0.0"
edition = "2024"
description = "High-performance Barnes-Hut N-body simulation engine"
license = "MIT"
repository = "https://github.com/machine-made/nebula-quanta"
homepage = "https://github.com/machine-made/nebula-quanta"
readme = "README.md"
keywords = ["simulation", "n-body", "barnes-hut", "astrophysics", "rust"]
categories = ["science", "command-line-utilities"]

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.10"

[dev-dependencies]
criterion = "0.8"

[lib]
path = "src/lib.rs"
bench = false

[[bin]]
name = "nq"
path = "src/main.rs"
bench = false

[[bench]]
name = "nbody"
harness = false

[features]
unrolled = []
default = []

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
